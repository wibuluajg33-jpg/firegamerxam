<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah & Kelola - FireGameX MC</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;}
        body {min-height:100vh; background:linear-gradient(135deg,#ff1a1a,#ff8800); padding:15px;}
        .kotak {max-width:480px; margin:20px auto; background:#fff; border-radius:15px; padding:25px; box-shadow:0 8px 25px rgba(0,0,0,0.25);}
        h1 {color:#ff3300; text-align:center; margin-bottom:20px; font-size:26px;}
        h2 {color:#ff4400; font-size:19px; margin:25px 0 15px; padding-bottom:8px; border-bottom:2px solid #ffddcc;}
        .grup {margin-bottom:18px;}
        label {display:block; margin-bottom:6px; font-weight:600; color:#222;}
        input, textarea {width:100%; padding:11px; border:2px solid #ffb380; border-radius:8px; font-size:15px;}
        input:focus, textarea:focus {outline:none; border-color:#ff4400;}
        textarea {min-height:90px; resize:vertical;}
        .pratinjau {width:100%; height:170px; border:2px dashed #ff7700; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#777; margin-bottom:8px; overflow:hidden; cursor:pointer; background:#fff8f2;}
        .pratinjau img {width:100%; height:100%; object-fit:cover;}
        button {width:100%; padding:13px; background:linear-gradient(90deg,#ff2222,#ff7700); color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; transition:0.2s;}
        button:hover {transform:translateY(-1px); box-shadow:0 4px 12px rgba(255,34,34,0.3);}
        input[type="file"] {display:none;}

        /* DAFTAR UNGGAHAN & TOMBOL EDIT */
        .daftar-saya {margin-top:10px;}
        .item-saya {display:flex; align-items:center; justify-content:space-between; padding:12px; background:#fff5f0; border-radius:8px; margin-bottom:10px;}
        .info-saya {flex:1; margin-right:10px;}
        .info-saya h4 {font-size:15px; color:#333; margin-bottom:2px;}
        .info-saya p {font-size:13px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
        .tombol-kecil {width:auto; padding:8px 12px; font-size:13px; border-radius:6px; margin:0;}
        .tombol-edit {background:#ff7700; margin-right:5px;}
        .tombol-hapus {background:#ff2222;}
        .tombol-batal {background:#888; margin-top:8px;}

        .nav-bawah {text-align:center; margin-top:15px;}
        .nav-bawah a {color:#ff3300; font-weight:bold; text-decoration:none;}
    </style>
</head>
<body>
    <div class="kotak">
        <h1>📤 Unggah / Perbarui File</h1>

        <input type="hidden" id="editId" value="">
        <div class="grup">
            <label>Foto Tampilan *</label>
            <div class="pratinjau" id="areaFoto">Klik untuk pilih foto</div>
            <input type="file" id="inputFoto" accept="image/*">
        </div>

        <div class="grup">
            <label>Nama File *</label>
            <input type="text" id="inputNama" placeholder="Contoh: Texture HD V3" required>
        </div>

        <div class="grup">
            <label>Tautan Unduh (.mcpack/.zip) *</label>
            <input type="url" id="inputLink" placeholder="https://..." required>
        </div>

        <div class="grup">
            <label>Deskripsi *</label>
            <textarea id="inputDeskripsi" placeholder="Jelaskan isi file..." required></textarea>
        </div>

        <button id="btnSimpan">✅ Publikasikan Baru</button>
        <button id="btnBatalEdit" class="tombol-batal" style="display:none;">❌ Batal Edit</button>

        <h2>📋 File yang Sudah Anda Unggah</h2>
        <div class="daftar-saya" id="daftarUnggahan"></div>

        <div class="nav-bawah">
            <a href="beranda.html">🔙 Lihat Semua Koleksi</a>
        </div>
    </div>

    <script>
        const areaFoto = document.getElementById('areaFoto');
        const inputFoto = document.getElementById('inputFoto');
        const inputNama = document.getElementById('inputNama');
        const inputLink = document.getElementById('inputLink');
        const inputDeskripsi = document.getElementById('inputDeskripsi');
        const editId = document.getElementById('editId');
        const btnSimpan = document.getElementById('btnSimpan');
        const btnBatalEdit = document.getElementById('btnBatalEdit');
        const daftarUnggahan = document.getElementById('daftarUnggahan');

        let fotoBase64 = "";
        let daftarData = [];

        // Baca data dari penyimpanan
        function bacaData() {
            try {
                const mentah = localStorage.getItem('mcKoleksi');
                daftarData = mentah ? JSON.parse(mentah) : [];
            } catch {
                localStorage.removeItem('mcKoleksi');
                daftarData = [];
            }
            tampilkanDaftarUnggahan();
        }

        // Tampilkan daftar file yang sudah diunggah
        function tampilkanDaftarUnggahan() {
            daftarUnggahan.innerHTML = "";
            if(daftarData.length === 0) {
                daftarUnggahan.innerHTML = "<p style='color:#777; text-align:center;'>Belum ada file yang diunggah</p>";
                return;
            }
            daftarData.forEach(item => {
                const el = document.createElement('div');
                el.className = "item-saya";
                el.innerHTML = `
                    <div class="info-saya">
                        <h4>${item.nama}</h4>
                        <p>${item.deskripsi.substring(0,35)}...</p>
                    </div>
                    <div style="display:flex;">
                        <button class="tombol-kecil tombol-edit" onclick="mulaiEdit(${item.id})">Ubah</button>
                        <button class="tombol-kecil tombol-hapus" onclick="hapusItem(${item.id})">Hapus</button>
                    </div>
                `;
                daftarUnggahan.appendChild(el);
            });
        }

        // Mulai mengedit data lama
        window.mulaiEdit = function(id) {
            const item = daftarData.find(i => i.id === id);
            if(!item) return;

            editId.value = id;
            inputNama.value = item.nama;
            inputLink.value = item.link;
            inputDeskripsi.value = item.deskripsi;
            fotoBase64 = item.foto;
            areaFoto.innerHTML = `<img src="${fotoBase64}">`;

            btnSimpan.textContent = "💾 Simpan Perubahan";
            btnBatalEdit.style.display = "block";
            window.scrollTo({top:0, behavior:'smooth'});
        };

        // Batalkan mode edit
        btnBatalEdit.addEventListener('click', () => {
            resetForm();
        });

        // Hapus file
        window.hapusItem = function(id) {
            if(confirm("Yakin ingin menghapus file ini?\nTindakan ini tidak bisa dibatalkan!")) {
                daftarData = daftarData.filter(i => i.id !== id);
                localStorage.setItem('mcKoleksi', JSON.stringify(daftarData));
                tampilkanDaftarUnggahan();
                if(editId.value == id) resetForm();
                alert("✅ File berhasil dihapus!");
            }
        };

        // Reset formulir ke kondisi awal
        function resetForm() {
            editId.value = "";
            inputNama.value = "";
            inputLink.value = "";
            inputDeskripsi.value = "";
            fotoBase64 = "";
            areaFoto.innerHTML = "Klik untuk pilih foto";
            btnSimpan.textContent = "✅ Publikasikan Baru";
            btnBatalEdit.style.display = "none";
        }

        // Pilih & tampilkan foto
        areaFoto.addEventListener('click', () => inputFoto.click());
        inputFoto.addEventListener('change', e => {
            const f = e.target.files[0];
            if(!f) return;
            const baca = new FileReader();
            baca.onload = ev => {
                fotoBase64 = ev.target.result;
                areaFoto.innerHTML = `<img src="${fotoBase64}">`;
            };
            baca.readAsDataURL(f);
        });

        // Simpan data (Baru / Perbarui)
        btnSimpan.addEventListener('click', () => {
            const nama = inputNama.value.trim();
            const link = inputLink.value.trim();
            const deskripsi = inputDeskripsi.value.trim();

            if(!nama || !link || !deskripsi || !fotoBase64) {
                alert('⚠️ Lengkapi semua kolom dan pilih foto!');
                return;
            }

            if(editId.value !== "") {
                // === PERBARUI DATA LAMA ===
                const idx = daftarData.findIndex(i => i.id == editId.value);
                if(idx !== -1) {
                    // Simpan ulasan yang sudah ada, hanya ubah data utama
                    daftarData[idx].nama = nama;
                    daftarData[idx].link = link;
                    daftarData[idx].deskripsi = deskripsi;
                    daftarData[idx].foto = fotoBase64;
                }
                alert('✅ Perubahan berhasil disimpan!');
            } else {
                // === TAMBAH DATA BARU ===
                daftarData.unshift({
                    id: Date.now(),
                    nama: nama,
                    link: link,
                    deskripsi: deskripsi,
                    foto: fotoBase64,
                    ulasan: []
                });
                alert('✅ File baru berhasil dipublikasikan!');
            }

            // Simpan ke penyimpanan & muat ulang tampilan
            localStorage.setItem('mcKoleksi', JSON.stringify(daftarData));
            resetForm();
            tampilkanDaftarUnggahan();
        });

        // Baca data saat halaman dibuka
        bacaData();
    </script>
</body>
</html>
